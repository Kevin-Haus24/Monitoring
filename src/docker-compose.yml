services:
  database:
    image: postgres:16-alpine
    container_name: database
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      placement:
        constraints:
          - node.role == worker

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      placement:
        constraints:
          - node.role == worker

  session-service:
    image: esherosw/session-service:latest
    container_name: session-service
    restart: unless-stopped
    depends_on:
      - database
      - rabbitmq
    networks:
      - default
      - monitoring
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    deploy:
      placement:
        constraints:
          - node.role == worker

  hotel-service:
    image: esherosw/hotel-service:latest
    container_name: hotel-service
    restart: unless-stopped
    depends_on:
      - database
      - rabbitmq
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotels_db
    ports:
      - "8082:8082"
    deploy:
      placement:
        constraints:
          - node.role == worker

  booking-service:
    image: esherosw/booking-service:latest
    container_name: booking-service
    restart: unless-stopped
    depends_on:
      - database
      - rabbitmq
      - hotel-service
      - payment-service
      - loyalty-service
    networks:
      - default
      - monitoring
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reservations_db

      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      RABBIT_MQ_USER: guest
      RABBIT_MQ_PASSWORD: guest
      RABBIT_MQ_QUEUE_NAME: messagequeue
      RABBIT_MQ_EXCHANGE: messagequeue-exchange

      HOTEL_SERVICE_HOST: hotel-service
      HOTEL_SERVICE_PORT: 8082

      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 8084

      LOYALTY_SERVICE_HOST: loyalty-service
      LOYALTY_SERVICE_PORT: 8085

    ports:
      - "8083:8083"
    deploy:
      placement:
        constraints:
          - node.role == worker

  payment-service:
    image: esherosw/payment-service:latest
    container_name: payment-service
    restart: unless-stopped
    depends_on:
      - database
      - rabbitmq
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db

    ports:
      - "8084:8084"
    deploy:
      placement:
        constraints:
          - node.role == worker

  loyalty-service:
    image: esherosw/loyalty-service:latest
    container_name: loyalty-service
    restart: unless-stopped
    depends_on:
      - database
      - rabbitmq
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: balances_db

    ports:
      - "8085:8085"
    deploy:
      placement:
        constraints:
          - node.role == worker

  report-service:
    image: esherosw/report-service:latest
    container_name: report-service
    restart: unless-stopped
    depends_on:
      - database
      - rabbitmq
    networks:
      - default
      - monitoring
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: statistics_db

      RABBIT_MQ_HOST: rabbitmq
      RABBIT_MQ_PORT: 5672
      RABBIT_MQ_USER: guest
      RABBIT_MQ_PASSWORD: guest
      RABBIT_MQ_QUEUE_NAME: messagequeue
      RABBIT_MQ_EXCHANGE: messagequeue-exchange

    ports:
      - "8086:8086"
    deploy:
      placement:
        constraints:
          - node.role == worker

  gateway-service:
    image: esherosw/gateway-service:latest
    container_name: gateway-service
    restart: unless-stopped
    depends_on:
      - session-service
      - hotel-service
      - booking-service
      - payment-service
      - loyalty-service
      - report-service
    networks:
      - default
      - monitoring
    environment:
      SESSION_SERVICE_HOST: session-service
      SESSION_SERVICE_PORT: 8081

      HOTEL_SERVICE_HOST: hotel-service
      HOTEL_SERVICE_PORT: 8082

      BOOKING_SERVICE_HOST: booking-service
      BOOKING_SERVICE_PORT: 8083

      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 8084

      LOYALTY_SERVICE_HOST: loyalty-service
      LOYALTY_SERVICE_PORT: 8085

      REPORT_SERVICE_HOST: report-service
      REPORT_SERVICE_PORT: 8086
    deploy:
      placement:
        constraints:
          - node.role == worker

  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    depends_on:
      - gateway-service
      - session-service
    ports:
      - "8087:8087"
      - "8081:8081"
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      placement:
        constraints:
          - node.role == worker

networks:
  default:
    driver: overlay
    attachable: true
  monitoring:
    external: true

volumes:
  postgres_data:

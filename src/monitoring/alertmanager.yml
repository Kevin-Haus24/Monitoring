global:
  smtp_require_tls: true
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "YOUR@gmail.com"
  smtp_auth_username: "YOUR@gmail.com"
  smtp_auth_identity: "YOUR@gmail.com"
  smtp_auth_password: "APP_PASSWORD"
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "instance"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: "default"
    email_configs:
      - to: "YOUR@gmail.com"
        from: "YOUR@gmail.com"
        send_resolved: true
    telegram_configs:
      - bot_token: "TELEGRAM_BOT_TOKEN"
        chat_id: 000000000
        send_resolved: true
